name: Build and Deploy AeroFuelHub

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      ASPNETCORE_ENVIRONMENT: Production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore AeroFuelHub.Web.sln

      - name: Build Project
        run: dotnet build AeroFuelHub.Web.csproj --configuration Release --no-restore

      - name: Publish Project
        run: dotnet publish AeroFuelHub.Web.csproj -c Release --no-build -o ./publish

      - name: Create appsettings.Production.json from GitHub Secret
        env:
          CONNECTION_STRING: ${{ secrets.PRODUCTION_CONNECTION_STRING }}
          SHOW_DEMO_CREDENTIALS: ${{ vars.SHOW_DEMO_CREDENTIALS || 'false' }}
        run: |
          if [ -z "$CONNECTION_STRING" ]; then
            echo "::error::GitHub secret PRODUCTION_CONNECTION_STRING is not set."
            exit 1
          fi
          if [ "$SHOW_DEMO_CREDENTIALS" != "true" ] && [ "$SHOW_DEMO_CREDENTIALS" != "false" ]; then
            echo "::error::GitHub variable SHOW_DEMO_CREDENTIALS must be 'true' or 'false'."
            exit 1
          fi
          jq -n \
            --arg cs "$CONNECTION_STRING" \
            --argjson demo "$SHOW_DEMO_CREDENTIALS" \
            '{
              "Logging": {
                "LogLevel": {
                  "Default": "Warning",
                  "Microsoft.AspNetCore": "Warning",
                  "Microsoft.EntityFrameworkCore": "Warning"
                }
              },
              "ConnectionStrings": {
                "DefaultConnection": $cs
              },
              "DemoCredentials": {
                "Enabled": $demo
              }
            }' > ./publish/appsettings.Production.json

      # IIS keeps the running app's DLLs locked (FTP 550). Uploading app_offline.htm
      # makes IIS stop the app and release the files before we replace them.
      - name: Take Site Offline
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          cat > app_offline.htm <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8" /><title>AeroFuel Hub - Updating</title></head>
          <body style="font-family:system-ui,sans-serif;text-align:center;padding-top:15vh;">
            <h1>AeroFuel Hub is being updated</h1>
            <p>Please check back in a minute.</p>
          </body>
          </html>
          EOF
          curl --fail --silent --show-error --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T app_offline.htm "ftp://$FTP_SERVER/wwwroot/app_offline.htm"
          # Give IIS time to shut down the app and release file locks
          sleep 10

      - name: Deploy to MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: false
          exclude: |
            **/app_offline.htm

      - name: Bring Site Back Online
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --silent --show-error --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_SERVER/" -Q "DELE /wwwroot/app_offline.htm" -o /dev/null
